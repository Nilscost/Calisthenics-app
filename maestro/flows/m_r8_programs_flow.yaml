# R8 T07 / R8.1-T08: pick a program in the Routine dropdown, open it in the Preview, start it, and verify the flow player exposes timers without per-item controls.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- runFlow:
    when: { visible: { id: session_pause } }
    commands:
      - tapOn: { id: session_more }
      - tapOn: "End workout"
      - tapOn: { id: session_end_confirm }
      - extendedWaitUntil: { visible: { id: end_done }, timeout: 15000 }
      - tapOn: { id: end_done }
- runFlow:
    when: { visible: { id: end_done } }
    commands:
      - tapOn: { id: end_done }
- extendedWaitUntil: { visible: { id: bottom_bar }, timeout: 15000 }
- tapOn: { id: tab_train }
- scrollUntilVisible: { element: { id: objective_type_ROUTINE }, direction: DOWN, timeout: 10000 }
- tapOn: { id: objective_type_ROUTINE }
# R8.1-T08 (F9): programs and my routines share one dropdown in two sections; a program loads into the Preview as a starting point
- tapOn: { id: goal_field }
# the menu is a popup window: select by text there
- extendedWaitUntil: { visible: "PROGRAMS", timeout: 8000 }
- assertVisible: "MY ROUTINES"
- takeScreenshot: 01-programs-dropdown-${VARIANT}
- tapOn: "Army PRT session"
- scrollUntilVisible: { element: { id: preview_button }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 01b-program-selected-${VARIANT}
- tapOn: { id: preview_button }
- extendedWaitUntil: { visible: { id: program_title }, timeout: 10000 }
- assertVisible: { id: program_item_0 }
- takeScreenshot: 02-program-preview-${VARIANT}
- scrollUntilVisible: { element: { id: preview_flow_switch }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 02b-program-preview-controls-${VARIANT}
- scrollUntilVisible: { element: { id: start_button }, direction: DOWN, timeout: 10000 }
- tapOn: { id: start_button }
- extendedWaitUntil: { visible: { id: session_pause }, timeout: 10000 }
- assertVisible: { id: session_time }
- assertNotVisible: { id: logger }
- assertNotVisible: { id: logger_plus }
- assertNotVisible: { id: logger_too_easy }
- assertNotVisible: { id: session_done }
- assertNotVisible: { id: session_skip }
- takeScreenshot: 03-flow-session-${VARIANT}
- tapOn: { id: session_more }
- tapOn: "End workout"
- tapOn: { id: session_end_confirm }
- extendedWaitUntil: { visible: { id: end_done }, timeout: 15000 }
- takeScreenshot: 04-flow-end-screen-${VARIANT}
- tapOn: { id: end_done }
# leave the objective on a body part so the flows that follow start from the usual workout
- extendedWaitUntil: { visible: { id: bottom_bar }, timeout: 10000 }
- scrollUntilVisible: { element: { id: objective_type_BODY_PART }, direction: UP, timeout: 10000 }
- tapOn: { id: objective_type_BODY_PART }
