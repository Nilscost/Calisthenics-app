# D — the other tabs: Progress (vertical tree, node panel, exercise detail, by skill), History (with the workout from flow C), Settings.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: bottom_bar }, timeout: 15000 }
- tapOn: { id: tab_progress }
- extendedWaitUntil: { visible: { id: tree_area }, timeout: 10000 }
- takeScreenshot: 01-progress-${VARIANT}
- tapOn: { id: "tree_node_.*", index: 0 }
- extendedWaitUntil: { visible: { id: node_panel }, timeout: 10000 }
- takeScreenshot: 02-node-panel-${VARIANT}
- tapOn: { id: panel_open_detail }
- extendedWaitUntil: { visible: { id: exercise_detail }, timeout: 10000 }
- takeScreenshot: 02b-exercise-detail-${VARIANT}
- tapOn: { id: detail_back }
# R7-T11 (D5, D6, O2): the planche lean says it needs the plank (a link); the detail has an Edit mode
- tapOn: { id: progress_mode_type }
- runFlow:
    when: { visible: "All progressions" }
    commands:
      - tapOn: { id: all_progressions }
- repeat:
    while: { notVisible: { id: route_chip_planche } }
    times: 8
    commands:
      - swipe:
          from: { id: progress_route_tabs, point: "90%, 50%" }
          direction: LEFT
- repeat:
    while: { notVisible: { id: route_chip_planche } }
    times: 8
    commands:
      - swipe:
          from: { id: progress_route_tabs, point: "10%, 50%" }
          direction: RIGHT
- tapOn: { id: route_chip_planche }
- scrollUntilVisible: { element: { id: tree_need_planche-lean }, direction: DOWN, timeout: 12000 }
- takeScreenshot: 02b2-planche-needs-plank-${VARIANT}
- tapOn: { id: tree_need_planche-lean }
- extendedWaitUntil: { visible: { id: detail_edit }, timeout: 8000 }
- tapOn: { id: detail_edit }
- takeScreenshot: 02b3-detail-edit-${VARIANT}
# R8.3: capture the five personal targets and Save / Cancel / Reset without changing stored values.
- scrollUntilVisible: { element: { id: personal_target_5 }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 02b4-personal-targets-${VARIANT}
- scrollUntilVisible: { element: { id: personal_targets_cancel }, direction: DOWN, timeout: 10000 }
- tapOn: { id: personal_targets_cancel }
- scrollUntilVisible: { element: { id: detail_back }, direction: UP, timeout: 10000 }
- tapOn: { id: detail_back }
- tapOn: { id: progress_mode_skill }
- takeScreenshot: 02c-by-skill-${VARIANT}
- tapOn: { id: tab_history }
- takeScreenshot: 03-history-${VARIANT}
- runFlow:
    when: { visible: { id: "session_.*" } }
    commands:
      - tapOn: { id: "session_.*", index: 0 }
      - takeScreenshot: 04-history-detail-${VARIANT}
      - back
- tapOn: { id: tab_settings }
- takeScreenshot: 05-settings-${VARIANT}
- scrollUntilVisible: { element: { id: set_app_volume }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 05a-volume-${VARIANT}
- scrollUntilVisible: { element: { id: set_auto_progress }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 05b-settings-progression-${VARIANT}
- scrollUntilVisible: { element: { id: settings_about }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 06-settings-bottom-${VARIANT}
