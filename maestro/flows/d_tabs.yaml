# D — the other tabs: Progress (tree + node sheet), History (with the workout from flow C), Settings.
appId: app.calisthenics.personal
---
- launchApp
- extendedWaitUntil: { visible: { id: bottom_bar }, timeout: 15000 }
- tapOn: { id: tab_progress }
- extendedWaitUntil: { visible: { id: tree_area }, timeout: 10000 }
- takeScreenshot: 01-progress-${VARIANT}
- tapOn: { id: "tree_node_.*", index: 0 }
- takeScreenshot: 02-node-sheet-${VARIANT}
- back
- tapOn: { id: tab_history }
- takeScreenshot: 03-history-${VARIANT}
- runFlow:
    when: { visible: { id: "session_.*" } }
    commands:
      - tapOn: { id: "session_.*", index: 0 }
      - takeScreenshot: 04-history-detail-${VARIANT}
      - back
- tapOn: { id: tab_settings }
- takeScreenshot: 05-settings-${VARIANT}
- scrollUntilVisible: { element: { id: settings_about }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 06-settings-bottom-${VARIANT}
