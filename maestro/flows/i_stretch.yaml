# I — L11b: the ready-made "Starting To Stretch" session: Train, its preview, a bump block and a hold block.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: train_start_button }, timeout: 15000 }
- tapOn: { id: objective_type_ROUTINE }
- tapOn: { id: goal_field }
- tapOn: "Starting To Stretch"
- takeScreenshot: 01-train-stretch-${VARIANT}
- tapOn: { id: preview_button }
- extendedWaitUntil: { visible: { id: stretch_protocol }, timeout: 15000 }
- takeScreenshot: 02-preview-stretch-${VARIANT}
- back
- extendedWaitUntil: { visible: { id: train_start_button }, timeout: 10000 }
- tapOn: { id: train_start_button }
- extendedWaitUntil: { visible: { id: session_note }, timeout: 20000 }
- takeScreenshot: 03-stretch-bumps-${VARIANT}
- tapOn: { id: session_skip }
- extendedWaitUntil: { visible: { id: session_note }, timeout: 10000 }
- takeScreenshot: 04-stretch-hold-${VARIANT}
- tapOn: { id: session_more }
- tapOn: "End workout"
- tapOn: "End workout"
- extendedWaitUntil: { visible: { id: end_title }, timeout: 10000 }
- tapOn: { id: end_done }
- extendedWaitUntil: { visible: { id: objective_type_BODY_PART }, timeout: 15000 }
- tapOn: { id: objective_type_BODY_PART }
