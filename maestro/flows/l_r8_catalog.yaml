# R8: deliberately open the Power progression, then find an exercise by its Pilates alias.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: bottom_bar }, timeout: 15000 }
- tapOn: { id: tab_progress }
- extendedWaitUntil: { visible: { id: progress_search }, timeout: 10000 }
- tapOn: { id: progress_mode_type }
- scrollUntilVisible: { element: { id: tab_chip_power }, direction: RIGHT, speed: 70, timeout: 10000, optional: true }
- scrollUntilVisible: { element: { id: tab_chip_power }, direction: LEFT, speed: 70, timeout: 10000 }
- tapOn: { id: tab_chip_power }
- runFlow:
    when: { visible: "All progressions" }
    commands:
      - tapOn: { id: all_progressions }
- scrollUntilVisible: { element: { id: route_chip_jump }, direction: RIGHT, speed: 70, timeout: 10000, optional: true }
- scrollUntilVisible: { element: { id: route_chip_jump }, direction: LEFT, speed: 70, timeout: 10000 }
- tapOn: { id: route_chip_jump }
- extendedWaitUntil: { visible: { id: tree_node_jump-squat }, timeout: 10000 }
- takeScreenshot: 01-power-progression-${VARIANT}
- tapOn: { id: progress_search }
- eraseText: 40
- inputText: "Teaser (Pilates)"
- extendedWaitUntil: { visible: { id: search_result_v-up }, timeout: 10000 }
- tapOn: { id: search_result_v-up }
- extendedWaitUntil: { visible: { id: detail_aliases }, timeout: 10000 }
- takeScreenshot: 02-alias-detail-${VARIANT}
