# B — Train setup and the Preview: cards, swap sheet, full timeline.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: preview_button }, timeout: 15000 }
- takeScreenshot: 01-train-${VARIANT}
# R7-T08 (D1): exercises per round, next to the rounds
- scrollUntilVisible: { element: { id: exercises_plus }, direction: DOWN, timeout: 8000 }
- takeScreenshot: 01b-train-exercises-${VARIANT}
- tapOn: { id: exercises_plus }
# R7-T13 (D10): the cool-down switch with its modes, then the Preview shows it
- scrollUntilVisible: { element: { id: cooldown_switch }, direction: DOWN, visibilityPercentage: 100, centerElement: true, timeout: 8000 }
# idempotent: the retry after a failed first attempt starts with the switch already on
- runFlow:
    when: { notVisible: { id: cooldown_mode_STRETCHING } }
    commands:
      - tapOn: { id: cooldown_switch }
- extendedWaitUntil: { visible: { id: cooldown_mode_STRETCHING }, timeout: 8000 }
- takeScreenshot: 01c-train-cooldown-${VARIANT}
# R8.2-T03 (G3): the Include row with all three parts in (idempotent on a retry)
- scrollUntilVisible: { element: { id: warmup_switch }, direction: UP, visibilityPercentage: 100, centerElement: true, timeout: 8000 }
- runFlow:
    when: { notVisible: { id: warmup_switch, checked: true } }
    commands:
      - tapOn: { id: warmup_switch }
- runFlow:
    when: { notVisible: { id: conditioning_switch, checked: true } }
    commands:
      - tapOn: { id: conditioning_switch }
- takeScreenshot: 01d-train-include-${VARIANT}
- tapOn: { id: preview_button }
- extendedWaitUntil: { visible: { id: start_button }, timeout: 10000 }
- takeScreenshot: 02-preview-${VARIANT}
- scrollUntilVisible: { element: { id: conditioning_caption }, direction: DOWN, speed: 25, timeout: 30000 }
- takeScreenshot: 02-preview-included-blocks-${VARIANT}
- scrollUntilVisible: { element: { id: preview_format_PAIRS }, direction: UP, speed: 25, timeout: 30000 }
# V16 / R7.2-T01: "All sets" header (no set tabs), the level stepper, and the "+" between blocks
- scrollUntilVisible: { element: { id: all_sets_header }, direction: DOWN, speed: 25, timeout: 30000 }
- assertVisible: { id: all_sets_header }
- assertNotVisible: { id: set_tab_2 }
# R8.1-T05 (F5, F6): the set format is chosen in the Preview, and an edit survives going back to Train and returning
- scrollUntilVisible: { element: { id: preview_format_PAIRS }, direction: DOWN, timeout: 8000 }
- takeScreenshot: 02a-preview-format-${VARIANT}
- tapOn: { id: preview_format_PAIRS }
# R8.1-T06 (F7): Flow, one toggle in the Preview (no rest between exercises); switched back off right away
- scrollUntilVisible: { element: { id: preview_flow_switch }, direction: DOWN, timeout: 8000 }
- tapOn: { id: preview_flow_switch }
- takeScreenshot: 02a2-preview-flow-${VARIANT}
- tapOn: { id: preview_flow_switch }
- scrollUntilVisible: { element: { id: all_sets_header }, direction: UP, timeout: 8000 }
- scrollUntilVisible: { element: { id: "level_plus_.*" }, direction: DOWN, timeout: 8000 }
- tapOn: { id: "level_plus_.*", index: 0 }
- takeScreenshot: 02b-preview-level-${VARIANT}
- back
- extendedWaitUntil: { visible: { id: preview_button }, timeout: 10000 }
- tapOn: { id: preview_button }
- extendedWaitUntil: { visible: { id: start_button }, timeout: 10000 }
- scrollUntilVisible: { element: { id: preview_format_PAIRS }, direction: DOWN, timeout: 8000 }
- assertVisible: { id: preview_format_PAIRS }
- takeScreenshot: 02b2-preview-back-again-${VARIANT}
- tapOn: { id: preview_format_CIRCUIT }
- scrollUntilVisible: { element: { id: all_sets_header }, direction: UP, timeout: 8000 }
- scrollUntilVisible: { element: { id: "add_after_.*" }, direction: DOWN, timeout: 8000 }
- tapOn: { id: "add_after_.*", index: 0 }
- extendedWaitUntil: { visible: "Add to the workout", timeout: 5000 }
- takeScreenshot: 02c-add-sheet-${VARIANT}
- tapOn: "Push"
- takeScreenshot: 02c2-add-sheet-push-${VARIANT}
- back
# V21: the progression rule picker (Rep range shows ranges and three sets), then back to App levels
- tapOn: { id: rule_REP_RANGE }
- takeScreenshot: 02e-rule-rep-range-${VARIANT}
- tapOn: { id: rule_APP_LEVELS }
# a slower scroll: at speed 40 the caption could pass between two visibility checks (dark run da9d667 overshot it)
- scrollUntilVisible: { element: { id: cooldown_caption }, direction: DOWN, speed: 20, timeout: 30000 }
- takeScreenshot: 02f-preview-cooldown-${VARIANT}
# R7.2-T04 (F5): remove a cool-down stretch with its x, then the + opens the stretch picker
- tapOn: { id: cooldown_remove_0 }
- takeScreenshot: 02g-cooldown-removed-${VARIANT}
- scrollUntilVisible: { element: { id: cooldown_add }, direction: DOWN, visibilityPercentage: 100, centerElement: true, timeout: 12000 }
- tapOn: { id: cooldown_add }
- extendedWaitUntil: { visible: "Cool-down stretch", timeout: 5000 }
- takeScreenshot: 02h-cooldown-add-sheet-${VARIANT}
- back
- scrollUntilVisible: { element: { id: timeline_toggle }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 03-preview-bottom-${VARIANT}
- tapOn: { id: timeline_toggle }
# the full timeline is long (about 9 exercises and the stretches between them), longest at font 1.3
- scrollUntilVisible: { element: { id: round_badge_.*_s2 }, direction: DOWN, speed: 70, timeout: 60000 }
- takeScreenshot: 04-timeline-${VARIANT}
- scrollUntilVisible: { element: { id: "swap_.*" }, direction: UP, timeout: 30000 }
- tapOn: { id: "swap_.*", index: 0 }
- extendedWaitUntil: { visible: "Swap this exercise", timeout: 5000 }
- takeScreenshot: 05-swap-sheet-${VARIANT}
# R7.2-T02: Other types opens the other movement families; the own family comes first.
# Swipe within the sheet viewport; the expanded catalog can put this below the fold.
- repeat:
    while: { notVisible: { id: swap_other_types } }
    times: 24
    commands:
      - swipe:
          from: { id: swap_sheet_body, point: "50%, 80%" }
          direction: UP
- tapOn: { id: swap_other_types }
- extendedWaitUntil: { visible: "Same family.*", timeout: 5000 }
- takeScreenshot: 05b-swap-other-types-${VARIANT}
- back
- back
