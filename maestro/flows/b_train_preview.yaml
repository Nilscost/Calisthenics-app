# B — Train setup and the Preview: cards, swap sheet, full timeline.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: preview_button }, timeout: 15000 }
- takeScreenshot: 01-train-${VARIANT}
# R7-T08 (D1): exercises per round, next to the rounds
- scrollUntilVisible: { element: { id: exercises_plus }, direction: DOWN, timeout: 8000 }
- takeScreenshot: 01b-train-exercises-${VARIANT}
- tapOn: { id: exercises_plus }
# R7-T13 (D10): the cool-down switch with its modes, then the Preview shows it
- scrollUntilVisible: { element: { id: cooldown_switch }, direction: DOWN, timeout: 8000 }
- tapOn: { id: cooldown_switch }
- takeScreenshot: 01c-train-cooldown-${VARIANT}
- tapOn: { id: preview_button }
- extendedWaitUntil: { visible: { id: start_button }, timeout: 10000 }
- takeScreenshot: 02-preview-${VARIANT}
# V16: set tabs, the level stepper, and the "+" between blocks
- tapOn: { id: set_tab_2 }
- tapOn: { id: "level_plus_.*", index: 0 }
- takeScreenshot: 02b-preview-set2-level-${VARIANT}
- tapOn: { id: "add_after_.*", index: 0 }
- extendedWaitUntil: { visible: "Add to the workout", timeout: 5000 }
- takeScreenshot: 02c-add-sheet-${VARIANT}
- tapOn: "Push"
- takeScreenshot: 02c2-add-sheet-push-${VARIANT}
- back
# V21: the progression rule picker (Rep range shows ranges and three sets), then back to App levels
- tapOn: { id: rule_REP_RANGE }
- takeScreenshot: 02e-rule-rep-range-${VARIANT}
- tapOn: { id: rule_APP_LEVELS }
- scrollUntilVisible: { element: { id: cooldown_caption }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 02f-preview-cooldown-${VARIANT}
- scrollUntilVisible: { element: { id: timeline_toggle }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 03-preview-bottom-${VARIANT}
- tapOn: { id: timeline_toggle }
- scrollUntilVisible: { element: { id: round_badge_.*_s2 }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 04-timeline-${VARIANT}
- scrollUntilVisible: { element: { id: "swap_.*" }, direction: UP, timeout: 10000 }
- tapOn: { id: "swap_.*", index: 0 }
- extendedWaitUntil: { visible: "Swap this exercise", timeout: 5000 }
- takeScreenshot: 05-swap-sheet-${VARIANT}
- back
- back
