# F — V20: the Pairs format from Train to the workout screen (header PAIR 1 · SET n OF m), then back to Circuit.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: train_start_button }, timeout: 15000 }
- tapOn: { id: format_PAIRS }
- takeScreenshot: 01-train-pairs-${VARIANT}
- tapOn: { id: train_start_button }
- extendedWaitUntil: { visible: { id: session_title }, timeout: 15000 }
- repeat:
    while: { notVisible: { id: session_done, enabled: true } }
    times: 6
    commands:
      - tapOn: { id: session_skip }
- takeScreenshot: 02-pairs-work-${VARIANT}
- tapOn: { id: session_done }
- extendedWaitUntil: { visible: { id: logger }, timeout: 10000 }
- takeScreenshot: 03-pairs-logger-${VARIANT}
- tapOn: { id: session_more }
- tapOn: "End workout"
- tapOn: "End workout"
- extendedWaitUntil: { visible: { id: end_title }, timeout: 10000 }
- tapOn: { id: end_edit }
- scrollUntilVisible: { element: { id: "end_fix_.*" }, direction: DOWN, timeout: 8000 }
- takeScreenshot: 04-pairs-end-editor-${VARIANT}
- tapOn: { id: end_done }
- extendedWaitUntil: { visible: { id: format_CIRCUIT }, timeout: 15000 }
- tapOn: { id: format_CIRCUIT }
