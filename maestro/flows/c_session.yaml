# C — a workout: first block, Done, the logger during recovery (the stretch block, R7-T02: readable caption with the stretch name), Done in the break, stretch and next work block, pause, end with confirm, end screen, per-round editor.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: preview_button }, timeout: 15000 }
- tapOn: { id: preview_button }
- extendedWaitUntil: { visible: { id: start_button }, timeout: 10000 }
- tapOn: { id: start_button }
- extendedWaitUntil: { visible: { id: session_title }, timeout: 15000 }
- takeScreenshot: 01-first-block-${VARIANT}
# Skip ahead until a work block offers Done (warm-up / get-ready blocks come first).
- repeat:
    while: { notVisible: { id: session_done, enabled: true } }
    times: 6
    commands:
      - tapOn: { id: session_skip }
- takeScreenshot: 02-work-block-${VARIANT}
- tapOn: { id: session_done }
- extendedWaitUntil: { visible: { id: logger }, timeout: 10000 }
- takeScreenshot: 03-logger-${VARIANT}
- tapOn: { id: logger_plus }
# R7-T02 (B4): DONE in the break saves the number and moves on to the next block. Shot 04 = the block after it.
- tapOn: { id: logger_done }
- extendedWaitUntil: { visible: { id: session_title }, timeout: 10000 }
- takeScreenshot: 04-after-break-done-${VARIANT}
- repeat:
    while: { notVisible: { id: session_done, enabled: true } }
    times: 6
    commands:
      - tapOn: { id: session_skip }
- takeScreenshot: 05-next-work-block-${VARIANT}
- tapOn: { id: session_pause }
- takeScreenshot: 06-paused-${VARIANT}
- tapOn: { id: session_more }
- tapOn: "End workout"
- takeScreenshot: 07-end-confirm-${VARIANT}
# The confirm dialog is its own window: select by text (the dialog title is "End the workout?").
- tapOn: "End workout"
- extendedWaitUntil: { visible: { id: end_title }, timeout: 10000 }
- takeScreenshot: 08-end-screen-${VARIANT}
# V04b: the per-round editor (one number per round, Too hard / Too easy / Pain).
- tapOn: { id: end_edit }
- scrollUntilVisible: { element: { id: "end_fix_.*" }, direction: DOWN, timeout: 8000 }
- takeScreenshot: 09-end-editor-${VARIANT}
- tapOn: { id: end_done }
