# R8: inspect the additional workout pools and adjust preview recovery without starting a session.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: preview_button }, timeout: 15000 }
- tapOn: { id: tab_train }
- scrollUntilVisible: { element: { id: additional_pools }, direction: DOWN, timeout: 10000 }
- runFlow:
    when: { notVisible: { id: pool_POWER } }
    commands:
      - tapOn: { id: additional_pools }
- assertVisible: { id: pool_POWER }
- assertVisible: { id: pool_CONDITIONING }
- assertVisible: { id: pool_PREHAB }
- assertVisible: { id: pool_MOBILITY }
- takeScreenshot: 01-additional-pools-${VARIANT}
# Show the plain-rest preview stepper; setting this is idempotent if a prior attempt already chose it.
- scrollUntilVisible: { element: { id: between_rest }, direction: DOWN, timeout: 10000 }
- tapOn: { id: between_rest }
- scrollUntilVisible: { element: { id: preview_button }, direction: UP, timeout: 10000 }
- tapOn: { id: preview_button }
- extendedWaitUntil: { visible: { id: start_button }, timeout: 15000 }
- scrollUntilVisible: { element: { id: "rest_.*_plus" }, direction: DOWN, timeout: 20000 }
- takeScreenshot: 02-preview-recovery-${VARIANT}
- tapOn: { id: "rest_.*_plus", index: 0 }
- takeScreenshot: 03-preview-recovery-adjusted-${VARIANT}
- back
- extendedWaitUntil: { visible: { id: bottom_bar }, timeout: 10000 }
