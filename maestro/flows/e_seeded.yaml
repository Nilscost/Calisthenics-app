# E — seeded data (V00b): History list + detail, Progress with stars, a kettlebell exercise sheet.
# scripts/ui_shots.sh runs maestro/hooks/e_seeded.pre.sh first (pm clear + debug seed broadcast).
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: bottom_bar }, timeout: 20000 }
- tapOn: { id: tab_history }
- extendedWaitUntil: { visible: { id: "session_.*" }, timeout: 10000 }
- takeScreenshot: 01-history-list-${VARIANT}
# V27b: summary tiles above; the progressions list and the lowest-set chart below
- scrollUntilVisible: { element: { id: "progression_.*" }, direction: DOWN, timeout: 8000, optional: true }
- takeScreenshot: 01b-history-progressions-${VARIANT}
- tapOn: { id: "progression_.*", index: 0, optional: true }
- takeScreenshot: 01c-history-chart-${VARIANT}
- scrollUntilVisible: { element: { id: history_title }, direction: UP, timeout: 8000, optional: true }
- tapOn: { id: "session_.*", index: 0 }
- extendedWaitUntil: { visible: { id: detail_title }, timeout: 10000 }
- takeScreenshot: 02-history-detail-${VARIANT}
- scrollUntilVisible: { element: { id: "fix_.*_too_easy", index: 3 }, direction: DOWN, timeout: 8000, optional: true }
- takeScreenshot: 03-history-detail-lower-${VARIANT}
- back
- tapOn: { id: tab_progress }
- extendedWaitUntil: { visible: { id: tree_area }, timeout: 10000 }
- takeScreenshot: 04-progress-push-${VARIANT}
# V27: a suggestion card, when there is one, pushes the tab chips down; close it so the swipes below hit the row
- repeat:
    while: { visible: { id: suggestion_card } }
    times: 6
    commands:
      - tapOn: { id: suggestion_dismiss }
# V25: the pull path without a band
- tapOn: { id: tab_chip_pull }
- takeScreenshot: 04b-progress-pull-${VARIANT}
- repeat:
    while: { notVisible: { id: tab_chip_squat } }
    times: 4
    commands:
      - swipe: { start: "90%, 20%", end: "10%, 20%" }
- tapOn: { id: tab_chip_squat }
- takeScreenshot: 05-progress-squat-${VARIANT}
# The tab chips scroll sideways: swipe the row until the tab is on screen.
- repeat:
    while: { notVisible: { id: tab_chip_hips } }
    times: 4
    commands:
      - swipe: { start: "90%, 20%", end: "10%, 20%" }
- tapOn: { id: tab_chip_hips }
- takeScreenshot: 06-progress-hips-${VARIANT}
# Kettlebell deadlift is a library variation, so open it through search instead of implying a main-tree rung.
- tapOn: { id: progress_search }
- inputText: "Kettlebell Deadlift"
- hideKeyboard
- extendedWaitUntil: { visible: { id: search_result_kettlebell-deadlift }, timeout: 10000 }
- takeScreenshot: 07-kettlebell-search-${VARIANT}
- tapOn: { id: search_result_kettlebell-deadlift }
- extendedWaitUntil: { visible: { id: exercise_detail }, timeout: 10000 }
- takeScreenshot: 07b-kettlebell-detail-${VARIANT}
# V26: the weight track under the five levels
- scrollUntilVisible: { element: { id: "weight_step_.*" }, direction: DOWN, timeout: 8000, optional: true }
- takeScreenshot: 07c-kettlebell-weights-${VARIANT}
- tapOn: { id: detail_back }
- tapOn: { id: progress_search }
- eraseText: 100
- hideKeyboard
# V25: the core tab with the tuck L-sit; R7-T11: the weighted exercises sit in the movement tabs (no "With weights" tab)
- repeat:
    while: { notVisible: { id: tab_chip_core } }
    times: 5
    commands:
      - swipe: { start: "90%, 20%", end: "10%, 20%" }
- tapOn: { id: tab_chip_core }
- takeScreenshot: 07d-progress-core-${VARIANT}
- repeat:
    while: { notVisible: { id: tab_chip_squat } }
    times: 6
    commands:
      - swipe: { start: "10%, 20%", end: "90%, 20%" }
- tapOn: { id: tab_chip_squat }
- takeScreenshot: 07e-progress-squat-weighted-${VARIANT}
# R7-T11 (D5, D6, O2): the push tab's planche lean says it needs the plank (a link); the detail has Edit and tappable Needs
- repeat:
    while: { notVisible: { id: tab_chip_push } }
    times: 6
    commands:
      - swipe: { start: "10%, 20%", end: "90%, 20%" }
- tapOn: { id: tab_chip_push }
- runFlow:
    when: { notVisible: { id: route_chip_planche } }
    commands:
      - tapOn: { id: all_progressions }
- tapOn: { id: route_chip_planche }
- scrollUntilVisible: { element: { id: tree_need_planche-lean }, direction: DOWN, timeout: 8000 }
- takeScreenshot: 07f-progress-push-planche-note-${VARIANT}
- tapOn: { id: tree_need_planche-lean }
- extendedWaitUntil: { visible: { id: detail_edit }, timeout: 8000 }
- tapOn: { id: detail_edit }
- takeScreenshot: 07g-detail-edit-${VARIANT}
- tapOn: { id: detail_back }
# L04: the Row tab (swipe the chip row back)
- repeat:
    while: { notVisible: { id: tab_chip_row } }
    times: 6
    commands:
      - swipe: { start: "10%, 20%", end: "90%, 20%" }
- tapOn: { id: tab_chip_row }
- takeScreenshot: 07f-progress-row-${VARIANT}
# L13: the Lower legs tab
- repeat:
    while: { notVisible: { id: tab_chip_calves } }
    times: 8
    commands:
      - swipe: { start: "90%, 20%", end: "10%, 20%" }
- tapOn: { id: tab_chip_calves }
- takeScreenshot: 07g-progress-lower-legs-${VARIANT}
# V07: the stretch library tab and one new stretch (sheet with clip, steps and cautions).
- repeat:
    while: { notVisible: { id: tab_chip_stretches } }
    times: 5
    commands:
      - swipe: { start: "90%, 20%", end: "10%, 20%" }
- tapOn: { id: tab_chip_stretches }
- extendedWaitUntil: { visible: { id: "stretch_stretch-calf-wall" }, timeout: 10000 }
- takeScreenshot: 08-stretch-list-${VARIANT}
- scrollUntilVisible: { element: { id: "stretch_stretch-thoracic" }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 09-stretch-list-bottom-${VARIANT}
- tapOn: { id: "stretch_stretch-thoracic" }
- extendedWaitUntil: { visible: "Thoracic Rotation.*", timeout: 10000 }
- takeScreenshot: 10-stretch-sheet-${VARIANT}
