# E — seeded data (V00b): History list + detail, Progress with stars, a kettlebell exercise sheet.
# scripts/ui_shots.sh runs maestro/hooks/e_seeded.pre.sh first (pm clear + debug seed broadcast).
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: bottom_bar }, timeout: 20000 }
- tapOn: { id: tab_history }
- extendedWaitUntil: { visible: { id: "session_.*" }, timeout: 10000 }
- takeScreenshot: 01-history-list-${VARIANT}
- tapOn: { id: "session_.*", index: 0 }
- extendedWaitUntil: { visible: { id: detail_title }, timeout: 10000 }
- takeScreenshot: 02-history-detail-${VARIANT}
- scrollUntilVisible: { element: { id: "fix_.*_too_easy", index: 3 }, direction: DOWN, timeout: 8000, optional: true }
- takeScreenshot: 03-history-detail-lower-${VARIANT}
- back
- tapOn: { id: tab_progress }
- extendedWaitUntil: { visible: { id: tree_area }, timeout: 10000 }
- takeScreenshot: 04-progress-push-${VARIANT}
- repeat:
    while: { notVisible: { id: tab_chip_squat } }
    times: 4
    commands:
      - swipe: { start: "90%, 16%", end: "10%, 16%" }
- tapOn: { id: tab_chip_squat }
- takeScreenshot: 05-progress-squat-${VARIANT}
# The tab chips scroll sideways: swipe the row until the tab is on screen.
- repeat:
    while: { notVisible: { id: tab_chip_hips } }
    times: 4
    commands:
      - swipe: { start: "90%, 16%", end: "10%, 16%" }
- tapOn: { id: tab_chip_hips }
- extendedWaitUntil: { visible: { id: "tree_node_kettlebell-deadlift" }, timeout: 10000 }
- takeScreenshot: 06-progress-hips-${VARIANT}
- tapOn: { id: "tree_node_kettlebell-deadlift" }
# The sheet is its own window: look for text that only the sheet has.
- extendedWaitUntil: { visible: "Stand with feet hip-width.*", timeout: 10000 }
- takeScreenshot: 07-kettlebell-sheet-${VARIANT}
