# H — V22: the ready-made routines. Train shows the Recommended Routine (pairs, plain rest), its Preview, then the Minimalist circuit.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: train_start_button }, timeout: 15000 }
- tapOn: { id: objective_type_ROUTINE }
- extendedWaitUntil: { visible: { id: format_PAIRS, enabled: true }, timeout: 10000 }
- takeScreenshot: 01-train-recommended-${VARIANT}
- tapOn: { id: preview_button }
- extendedWaitUntil: { visible: { id: start_button }, timeout: 15000 }
- takeScreenshot: 02-preview-recommended-${VARIANT}
- scrollUntilVisible: { element: { id: "exercise_rr-core-back.*" }, direction: DOWN, timeout: 10000 }
- takeScreenshot: 03-preview-core-triplet-${VARIANT}
- back
- extendedWaitUntil: { visible: { id: goal_field }, timeout: 10000 }
- tapOn: { id: goal_field }
- tapOn: "Minimalist Routine"
- takeScreenshot: 04-train-minimalist-${VARIANT}
- tapOn: { id: objective_type_BODY_PART }
- tapOn: { id: format_CIRCUIT }
- tapOn: { id: warmup_switch }
