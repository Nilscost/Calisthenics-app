# R8: compare the default progression pool with the deliberate route picker and its collapsed alternate.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: bottom_bar }, timeout: 15000 }
- tapOn: { id: tab_progress }
- tapOn: { id: progress_mode_type }
- extendedWaitUntil: { visible: { id: all_progressions }, timeout: 10000 }
- runFlow:
    when: { visible: "Default progressions" }
    commands:
      - tapOn: { id: all_progressions }
- takeScreenshot: 01-default-progression-pool-${VARIANT}
- tapOn: { id: all_progressions }
- repeat:
    while: { notVisible: { id: route_chip_pushup } }
    times: 8
    commands:
      - swipe:
          from: { id: progress_route_tabs, point: "90%, 50%" }
          direction: LEFT
- repeat:
    while: { notVisible: { id: route_chip_pushup } }
    times: 8
    commands:
      - swipe:
          from: { id: progress_route_tabs, point: "10%, 50%" }
          direction: RIGHT
- extendedWaitUntil: { visible: { id: route_chip_pushup }, timeout: 10000 }
- tapOn: { id: route_chip_pushup }
- repeat:
    while: { notVisible: { id: tree_node_pushup-feet-elevated } }
    times: 8
    commands:
      - swipe:
          from: { id: tree_rows, point: "50%, 80%" }
          direction: UP
- assertVisible: { id: tree_node_pushup-feet-elevated }
- takeScreenshot: 02-push-up-main-spine-${VARIANT}
# R8.1-T10 (F13): the same-rung alternate is a node beside its rung, no toggle
- assertVisible: { id: tree_node_pushup-diamond }
- tapOn: { id: tree_node_pushup-feet-elevated }
- takeScreenshot: 03-push-up-other-ways-${VARIANT}
