# G — V18: save a routine from the Preview and find it under Objective -> Routine on Train.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: preview_button }, timeout: 15000 }
- tapOn: { id: preview_button }
- extendedWaitUntil: { visible: { id: save_routine_button }, timeout: 10000 }
- tapOn: { id: save_routine_button }
- extendedWaitUntil: { visible: "Name", timeout: 5000 }
- tapOn: "Name"
- inputText: "Push day"
- takeScreenshot: 01-save-dialog-${VARIANT}
- tapOn: "Save"
- extendedWaitUntil: { visible: { id: routine_saved_note }, timeout: 5000 }
- takeScreenshot: 02-saved-${VARIANT}
- back
- extendedWaitUntil: { visible: { id: objective_type_ROUTINE }, timeout: 10000 }
- takeScreenshot: 03-train-routine-${VARIANT}
- tapOn: { id: objective_type_BODY_PART }
