# C2 — the Prepare (get ready) block shows what comes next: name, target and side, and after a hold only one compact row to correct that hold.
# Walks the default workout with Skip and takes a screenshot at each Prepare block that matches; the hold row is only present when the block before was a hold.
appId: app.calisthenics.personal
---
- launchApp
- runFlow: ../common/dismiss_system_dialogs.yaml
- extendedWaitUntil: { visible: { id: preview_button }, timeout: 15000 }
- tapOn: { id: preview_button }
- extendedWaitUntil: { visible: { id: start_button }, timeout: 10000 }
- tapOn: { id: start_button }
- extendedWaitUntil: { visible: { id: session_title }, timeout: 15000 }
# Walk through the workout with Skip (blocks also end on their own timers, so nothing is asserted at a fixed step): screenshot each Prepare block,
# and in particular a Prepare after a hold (compact "held" row) and a Prepare of a one-sided exercise ("Left side").
- repeat:
    times: 60
    commands:
      - runFlow:
          when: { visible: { id: session_name } }
          commands:
            - takeScreenshot: 01-prepare-${VARIANT}
            - runFlow:
                when: { visible: { id: logger_minus } }
                commands:
                  - assertVisible: { id: logger_name }
                  - takeScreenshot: 02-prepare-after-hold-${VARIANT}
            - runFlow:
                when: { visible: ".*Left side.*" }
                commands:
                  - takeScreenshot: 03-prepare-split-left-${VARIANT}
      - tapOn: { id: session_skip, optional: true }   # the workout may already have ended
      - waitForAnimationToEnd: { timeout: 1000 }
