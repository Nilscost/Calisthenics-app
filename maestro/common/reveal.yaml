# Brings the element with id ${ID} on screen from wherever the page is scrolled: up first, then down.
appId: app.calisthenics.personal
---
- runFlow:
    when: { notVisible: { id: "${ID}" } }
    commands:
      - scrollUntilVisible: { element: { id: "${ID}" }, direction: UP, timeout: 60000, speed: 40, optional: true }
- runFlow:
    when: { notVisible: { id: "${ID}" } }
    commands:
      - scrollUntilVisible: { element: { id: "${ID}" }, direction: DOWN, timeout: 60000, speed: 40 }
