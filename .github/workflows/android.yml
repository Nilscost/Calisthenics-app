name: verify
on:
  push:
    branches-ignore: [ui-shots]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); only add what this build pins.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: python3 tools/preflight.py
      - run: python3 tools/check_migration_sql.py
      - run: bash scripts/verify.sh   # tests + lint + APK + content validation; fails on any error
      # No signing keys, no user data, no upload steps.
