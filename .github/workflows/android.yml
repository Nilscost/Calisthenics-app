name: verify
on:
  push:
    branches-ignore: [ui-shots]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: actions/setup-node@v5
        with: { node-version: '26.8.1' }
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); only add what this build pins.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-37.0" "build-tools;36.0.0"'
      - run: python3 tools/preflight.py
      - run: python3 tools/check_migration_sql.py
      - run: bash scripts/verify.sh   # tests + lint + APK + content validation; fails on any error
      # No signing keys, no user data, no upload steps.
  browser-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: actions/setup-node@v5
        with: { node-version: '26.8.1' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-37.0" "build-tools;36.0.0"'
      - run: ./gradlew -p tools/browser-tests/storage wasmJsBrowserDevelopmentExecutableDistribution --console=plain
      - run: npm ci --prefix tools/browser-tests --ignore-scripts --no-audit --no-fund
      - run: npx --prefix tools/browser-tests playwright install --with-deps chromium webkit
      - name: Actual browser persistence and transaction contracts
        run: |
          python3 -m http.server 4822 --bind 127.0.0.1 --directory tools/browser-tests/storage/build/dist/wasmJs/developmentExecutable > "$RUNNER_TEMP/storage-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          STORAGE_TEST_RESULTS="$RUNNER_TEMP/storage-results.json" node tools/browser-tests/storage-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-storage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/storage-results.json
            ${{ runner.temp }}/storage-server.log
