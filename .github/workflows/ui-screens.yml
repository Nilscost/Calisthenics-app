name: ui-screens
# V00 (docs/12-v2-plan.md §7): build the debug APK, run the Maestro flows on an emulator sized like the
# Galaxy S21 (1080x2400, 420 dpi) in three variants (light, dark, font 1.3), and publish the screenshots:
# as an Actions artifact and on the orphan branch `ui-shots` under <short-sha>/<flow>/<step>-<variant>.png.
on:
  push:
    branches: [main, 'ui-check/**']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: write   # only to push the ui-shots branch
concurrency:
  group: ui-screens-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: '2.11.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: ./gradlew :app:assembleDebug --console=plain
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ui_shots.sh app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/shots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots-${{ github.sha }}
          path: |
            ${{ runner.temp }}/shots
            ~/.maestro/tests
          if-no-files-found: warn
      - name: Publish to the ui-shots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pillow
          bash scripts/publish_ui_shots.sh "$RUNNER_TEMP/shots" "${GITHUB_SHA::7}" "${{ github.ref_name }}"
