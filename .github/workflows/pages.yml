name: pages
# Builds the web app and deploys it to GitHub Pages (https://<owner>.github.io/Calisthenics-app/). The link is not announced anywhere.
on:
  workflow_dispatch:
  push:
    branches: [codex/kmp-port, main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-37.0" "build-tools;36.0.0"'
      - run: ./gradlew :web:wasmJsBrowserDistribution --console=plain
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist/wasmJs/productionExecutable
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
